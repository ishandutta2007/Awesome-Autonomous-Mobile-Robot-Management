<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="glowGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/><stop offset="100%" stop-color="#0284c7" stop-opacity="0"/></radialGradient><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".4" stroke-width=".8" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity=".5"/></pattern><filter id="shadowGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseBeam{0%{stroke-dashoffset:1000;opacity:.3}50%{opacity:1}}@keyframes floatRobot{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-8px) scale(1.02)}}@keyframes radarSweep{0%{transform:rotate(0deg)}}@keyframes nodePulse{0%{r:6px;opacity:.7}50%{r:10px;opacity:1}}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff}.subtitle-text{font-weight:500;font-size:18px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:13px;fill:#38bdf8}.animated-line{stroke-dasharray:20 10;animation:pulseBeam 25s linear infinite}.radar-line{transform-origin:1000px 200px;animation:radarSweep 12s linear infinite}.pulsing-node{animation:nodePulse 3s ease-in-out infinite}</style></defs><rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/><rect width="1200" height="400" fill="url(#gridPattern)" rx="16"/><g fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity=".6"><path d="M 100 320 Q 300 240 500 300 T 900 150 T 1100 280" class="animated-line"/><path stroke="#38bdf8" stroke-dasharray="8 6" stroke-width="1.5" d="M 50 100 Q 250 180 600 80 T 1000 220" opacity=".4"/></g><g opacity=".3"><circle cx="1000" cy="200" r="140" fill="none" stroke="#64748b" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="1000" cy="200" r="90" fill="none" stroke="#475569" stroke-width="1"/><circle cx="1000" cy="200" r="40" fill="none" stroke="#475569" stroke-width="1"/><line x1="1000" x2="1140" y1="200" y2="200" stroke="#a855f7" stroke-width="2" class="radar-line"/></g><g><circle cx="910" cy="140" r="7" fill="#38bdf8" class="pulsing-node"/><circle cx="1050" cy="250" r="6" fill="#a855f7" class="pulsing-node" style="animation-delay:1s"/><circle cx="820" cy="280" r="8" fill="#ec4899" class="pulsing-node" style="animation-delay:2s"/></g><rect width="1100" height="310" x="50" y="45" fill="#0f172a" fill-opacity=".55" stroke="#334155" stroke-width="1" rx="12"/><rect width="1100" height="4" x="50" y="45" fill="url(#glowGrad)"/><g transform="translate(80, 80)"><rect width="320" height="32" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="16"/><text x="16" y="21" class="badge-text">🤖 AUTONOMOUS MOBILE ROBOTICS</text></g><text x="80" y="160" class="title-text" filter="url(#shadowGlow)">Awesome AMR Management</text><text x="80" y="210" class="subtitle-text">Curated SaaS Platforms &amp; Open-Source Tools for Fleet Orchestration,</text><text x="80" y="238" class="subtitle-text">Multi-Robot Traffic Control, WMS Integration, Nav2 &amp; Open-RMF</text><g><g transform="translate(80, 280) translate(0, 0)"><rect width="170" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🌐 Fleet Orchestration</text></g><g transform="translate(80, 280) translate(185, 0)"><rect width="180" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">🚦 Traffic Deconfliction</text></g><g transform="translate(80, 280) translate(380, 0)"><rect width="140" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">📦 Open-RMF</text></g><g transform="translate(80, 280) translate(535, 0)"><rect width="120" height="36" fill="#1e293b" stroke="#475569" stroke-width="1" rx="8"/><text x="14" y="23" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">⚡ ROS 2 Nav2</text></g></g></svg>