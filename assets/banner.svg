<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Robot Node Glow Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1.5" fill="#475569" fill-opacity="0.5"/>
    </pattern>

    <!-- SVG Filters for Glow -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #cbd5e1;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      
      /* Dynamic Animations */
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 1000; opacity: 0.3; }
        50% { opacity: 1; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes floatRobot {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.02); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 6px; opacity: 0.7; }
        50% { r: 10px; opacity: 1; }
      }

      .animated-line {
        stroke-dasharray: 20 10;
        animation: pulseBeam 25s linear infinite;
      }
      .robot-group {
        animation: floatRobot 6s ease-in-out infinite;
        transform-origin: center;
      }
      .radar-line {
        transform-origin: 1000px 200px;
        animation: radarSweep 12s linear infinite;
      }
      .pulsing-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Grid Layer -->
  <rect width="1200" height="400" fill="url(#gridPattern)" rx="16"/>

  <!-- Dynamic Network Connection Paths (Background) -->
  <g stroke="url(#glowGrad)" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 100 320 Q 300 240 500 300 T 900 150 T 1100 280" class="animated-line"/>
    <path d="M 50 100 Q 250 180 600 80 T 1000 220" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  </g>

  <!-- Dynamic Radar / AMR Positioning Element (Right Side Background) -->
  <g opacity="0.3">
    <circle cx="1000" cy="200" r="140" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="1000" cy="200" r="90" fill="none" stroke="#475569" stroke-width="1"/>
    <circle cx="1000" cy="200" r="40" fill="none" stroke="#475569" stroke-width="1"/>
    <line x1="1000" y1="200" x2="1140" y2="200" stroke="#a855f7" stroke-width="2" class="radar-line"/>
  </g>

  <!-- Animated Robot / Fleet Nodes (Background Accents) -->
  <g>
    <circle cx="910" cy="140" r="7" fill="#38bdf8" class="pulsing-node"/>
    <circle cx="1050" cy="250" r="6" fill="#a855f7" class="pulsing-node" style="animation-delay: 1s;"/>
    <circle cx="820" cy="280" r="8" fill="#ec4899" class="pulsing-node" style="animation-delay: 2s;"/>
  </g>

  <!-- Title Card Container with Semi-transparent Backdrop for Foreground Contrast -->
  <rect x="50" y="45" width="1100" height="310" rx="12" fill="#0f172a" fill-opacity="0.55" stroke="#334155" stroke-width="1"/>

  <!-- Top Accent Bar -->
  <rect x="50" y="45" width="1100" height="4" fill="url(#glowGrad)"/>

  <!-- Category Pill Badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="16" y="21" class="badge-text">🤖 AUTONOMOUS MOBILE ROBOTICS</text>
  </g>

  <!-- Main Title (Foreground) -->
  <text x="80" y="160" class="title-text" filter="url(#shadowGlow)">
    Awesome AMR Management
  </text>

  <!-- Subtitle (Foreground) -->
  <text x="80" y="210" class="subtitle-text">
    Curated SaaS Platforms &amp; Open-Source Tools for Fleet Orchestration,
  </text>
  <text x="80" y="238" class="subtitle-text">
    Multi-Robot Traffic Control, WMS Integration, Nav2 &amp; Open-RMF
  </text>

  <!-- Key Feature Pills (Foreground Bottom) -->
  <g transform="translate(80, 280)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="170" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🌐 Fleet Orchestration</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(185, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚦 Traffic Deconfliction</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(380, 0)">
      <rect width="140" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📦 Open-RMF</text>
    </g>
    <!-- Pill 4 -->
    <g transform="translate(535, 0)">
      <rect width="120" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="14" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ ROS 2 Nav2</text>
    </g>
  </g>
</svg>
